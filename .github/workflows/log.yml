name: Log Wolfline positions

# Each run lasts ~2h20m and starts the next one before its last chunk, so
# consecutive runs overlap. watchdog.yml restarts the chain if it ever stops.
# Each run saves to its own file.
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "Number of 28-minute chunks to log"
        default: "5"
      minutes:
        description: "Minutes per chunk"
        default: "28"

permissions:
  contents: write
  actions: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gtfs-realtime-bindings
      - name: Log and commit every 28 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "wolfline-logger"
          git config user.email "actions@users.noreply.github.com"
          chunks="${{ inputs.chunks || 5 }}"
          for i in $(seq 1 "$chunks"); do
            # GitHub's scheduler can skip runs, so each full run starts the next one
            # before its last chunk; the overlap covers the new run's start-up time.
            # Only the newest active run does this, so two runs started close together
            # (e.g. by the watchdog) never become two parallel chains.
            if [ "$i" = "$chunks" ] && [ "$chunks" -ge 5 ]; then
              newer=$(gh run list --workflow log.yml --limit 20 --json databaseId,status \
                --jq "[.[] | select(.databaseId > ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\"))] | length" || echo 0)
              if [ "$newer" = "0" ]; then
                gh workflow run log.yml --ref main || echo "could not start next run"
              else
                echo "a newer run is active; not starting another"
              fi
            fi
            # A crash in one chunk must not end the run before it starts the next one.
            python logger.py --minutes "${{ inputs.minutes || 28 }}" --interval 30 --out data || echo "logger exited with an error"
            git add data || true
            git commit -q -m "data: $(TZ=America/New_York date '+%Y-%m-%d %H:%M')" || continue
            for attempt in 1 2 3 4 5; do
              git pull -q --rebase && git push -q && break
              sleep $((attempt * 10))
            done
          done
